# Scheduling: triggered daily at 5:30pm HKT (09:30 UTC) via cron-job.org
# cron-job.org POSTs to the workflow_dispatch API — GitHub Actions native cron
# was replaced due to reliability issues with low-traffic repositories.
name: Daily Macro Brief

on:
  workflow_dispatch:          # triggered externally via cron-job.org at 09:30 UTC (5:30pm HKT)

jobs:
  run_brief:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run brief
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TELEGRAM_ADMIN_CHAT_ID: ${{ secrets.TELEGRAM_ADMIN_CHAT_ID }}
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
          EXA_API_KEY: ${{ secrets.EXA_API_KEY }}
          NEWSAPI_KEY: ${{ secrets.NEWSAPI_KEY }}
          FINNHUB_API_KEY: ${{ secrets.FINNHUB_API_KEY }}
        run: python main.py

      - name: Upload state on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: run-state
          path: state/
