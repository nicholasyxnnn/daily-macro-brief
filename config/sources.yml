# sources.yml — curated source registry for Module 5 (Theme Radar)
# Tiers: tier_1 = central banks / supranational (highest signal), tier_2 = institutional/independent

central_banks:
  - name: Federal Reserve Speeches
    rss: https://www.federalreserve.gov/feeds/speeches.xml
    credibility: tier_1
    always_include: true

  - name: ECB Publications
    rss: https://www.ecb.europa.eu/rss/fsr.html
    credibility: tier_1

  - name: ECB Working Papers
    rss: https://www.ecb.europa.eu/pub/research/working-papers/rss/ecb.wpaper.xml
    credibility: tier_1
    position_tags: [rates, inflation, EM]

  - name: BIS Working Papers
    rss: https://www.bis.org/doclist/wppubls.rss
    credibility: tier_1

  - name: BOJ Speeches
    rss: https://www.boj.or.jp/en/rss/release.xml
    credibility: tier_1
    position_tags: [JPY, BOJ, rates]

  - name: Bank of Canada
    rss: https://www.bankofcanada.ca/feed/
    credibility: tier_1

  - name: Reserve Bank of Australia
    rss: https://www.rba.gov.au/rss/rss-cb-speeches.xml
    credibility: tier_1

  - name: IMF Blog
    rss: https://www.imf.org/en/Blogs/rss
    credibility: tier_1
    position_tags: [EM, fiscal, dollar, rates]

  - name: NBER Working Papers
    rss: https://www.nber.org/rss/new_releases.xml
    credibility: tier_1
    position_tags: [fiscal, rates, inflation, EM]

  - name: World Bank Research
    rss: https://blogs.worldbank.org/rss.xml
    credibility: tier_1
    position_tags: [EM, BRL, INR, IDR]

buyside:
  - name: PIMCO Blog
    rss: https://www.pimco.com/rss/feeds/blog.xml
    credibility: tier_2
    position_tags: [rates, duration, EM]

  - name: Hoisington Quarterly
    url: https://hoisington.com/economic_overview.html
    credibility: tier_2
    scrape_frequency: quarterly
    position_tags: [duration, deflation]

  - name: GMO Letters
    url: https://www.gmo.com/americas/research-library/
    credibility: tier_2
    scrape_frequency: monthly

independent:
  - name: Lyn Alden
    rss: https://www.lynalden.com/feed/
    credibility: tier_2
    position_tags: [gold, dollar, fiscal, EM]

  - name: Doomberg
    rss: https://doomberg.substack.com/feed
    credibility: tier_2
    position_tags: [energy, commodities]

  - name: Macro Alf (Alfonso Peccatiello)
    rss: https://themacrocompass.substack.com/feed
    credibility: tier_2
    position_tags: [rates, macro]

  - name: Adam Tooze Chartbook
    rss: https://adamtooze.substack.com/feed
    credibility: tier_2
    position_tags: [geopolitics, fiscal, EM]

  - name: Concoda
    rss: https://concoda.substack.com/feed
    credibility: tier_2
    position_tags: [dollar, liquidity]

  - name: Joseph Wang (FedGuy)
    rss: https://fedguy.com/feed/
    credibility: tier_2
    position_tags: [dollar, liquidity, rates, UST]

  - name: Luke Gromen (FFTT)
    rss: https://fftt-llc.substack.com/feed
    credibility: tier_2
    position_tags: [dollar, gold, fiscal, EM]

  - name: Jeff Snider (Eurodollar University)
    rss: https://eurodollar.substack.com/feed
    credibility: tier_2
    position_tags: [dollar, eurodollar, rates, liquidity]

  - name: Andreas Steno Larsen
    rss: https://andreastenolarsen.substack.com/feed
    credibility: tier_2
    position_tags: [rates, macro, EM]

  - name: CrossBorder Capital (Michael Howell)
    rss: https://crossbordercapital.substack.com/feed
    credibility: tier_2
    position_tags: [liquidity, dollar, gold, EM]
