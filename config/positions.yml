house_view:
  narrative: >
    Late-cycle expansion cracking unevenly. US slowing but not in recession;
    Fed on hold as services inflation remains sticky. Europe weaker with ECB
    cutting. BoJ normalizing slowly. Divergence drives USD strength.
    Bear duration on sticky inflation and elevated supply. Gold as structural
    hedge on EM reserve diversification and de-dollarization flows.
    Stagflation-lite base case: growth disappoints but inflation stays high
    enough to keep central banks cautious.
  themes:
    - USD strength
    - Bear duration
    - Long gold / real assets
    - Energy tactical long
    - Recession risk H2 2026
    - EM selectivity

